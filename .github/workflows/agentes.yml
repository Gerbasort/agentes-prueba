name: Ejecutar agentes

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Archivo de configuración"
        required: true
        default: "config.yml"
      tema:
        description: "Tema (opcional, reemplaza la 'tarea' del config)"
        required: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Correr agentes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEMA: ${{ inputs.tema }}
          CONFIG: ${{ inputs.config }}
        run: python agentes.py "$CONFIG"

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: outputs/
